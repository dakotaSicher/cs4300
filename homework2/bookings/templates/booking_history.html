{% extends 'base.html' %}
{% block title %} Booking History {% endblock %}
{% block content %}
    <h2> {{username}} </h2 >
    <ul class = " list - group " >
        {% for booking in bookings %}
        <li class = " list - group - item ">
            <h5> Movie: {{ booking.movie_title}} </h5>
            <p> Your Seat:  {{ booking.seat_number }} </p >
            <p> Date Booked: {{ booking.book_date }} </p >
        </li >
        {% endfor %}
    </ul >
{% endblock %}
